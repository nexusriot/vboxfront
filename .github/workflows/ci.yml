name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
        env:
          QT_QPA_PLATFORM: offscreen

  e2e:
    # The hermetic end-to-end suite: the real app driven against a stateful
    # fake VBoxManage inside a container, with no network and no VirtualBox.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the end-to-end image
        run: docker build -f e2e/Dockerfile -t vboxfront-e2e .
      - name: Run unit + end-to-end suites
        run: docker run --rm --network none vboxfront-e2e

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe needs the tag history for the version string
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libglib2.0-0 binutils
      - name: Build binary and .deb
        run: make deb
      - uses: actions/upload-artifact@v4
        with:
          name: vboxfront-deb
          path: dist/*.deb

  build-desktop:
    # Windows and macOS binaries from the same spec. VBoxManage lives
    # elsewhere on both (Program Files / the .app bundle), which the Settings
    # override covers; nothing here needs VirtualBox installed.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pillow
      - name: Render the icon
        run: python scripts/render_icon.py build/icon.png 512
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyi vboxfront.spec
      - name: Smoke test the CLI entry point
        # The windowed Windows build has no console to print to, so the
        # check runs from source there; the macOS binary is run itself.
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            ./dist/vboxfront --version
          else
            python vboxfront.py --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vboxfront-${{ runner.os }}
          path: |
            dist/vboxfront.exe
            dist/vboxfront.app
            dist/vboxfront
          if-no-files-found: ignore
